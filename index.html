    // Mỗi luật: nhận theo tên bài tập (từ trên xuống, khớp đầu tiên), c = nhóm tác động chính, p = nhóm tác động phụ
    const LUAT_BAI_TAP = [
        { re: /tai ?chi|thái cực/, c: [], p: ['qd', 'mong', 'bc', 'co'] },
        { re: /đạp xe|xe đạp|bike|cycling/, c: [], p: ['qd', 'mong', 'bc'] },
        { re: /treo xà|dead hang|hang/, c: ['lx'], p: ['tay', 'vai', 'co'] },
        { re: /pull.?up|chin.?up|kéo xà/, c: ['lx'], p: ['tay', 'th', 'co'] },
        { re: /pulldown|pull.?down|lat /, c: ['lx'], p: ['tay', 'th'] },
        { re: /face pull/, c: ['vai', 'th'], p: [] },
        { re: /\brow\b|chèo|kéo tạ/, c: ['th', 'lx'], p: ['tay', 'vai', 'co'] },
        { re: /shrug|nhún vai/, c: ['th'], p: ['tay'] },
        { re: /lateral raise|front raise|rear delt|nâng vai|đẩy vai|shoulder press|overhead press|\bohp\b/, c: ['vai'], p: ['th', 'tay'] },
        { re: /incline|bench|chest|ngực|fly\b|pec/, c: ['ng'], p: ['vai', 'tay'] },
        { re: /chống đẩy|push.?up|dips?\b/, c: ['ng'], p: ['vai', 'tay', 'co'] },
        { re: /tricep|triceps|tay sau|pushdown/, c: ['tay'], p: [] },
        { re: /curl|bicep|tay trước/, c: ['tay'], p: [] },
        { re: /pallof/, c: ['co'], p: ['vai'] },
        { re: /ab wheel|dead bug|plank|crunch|sit.?up|russian|leg raise|cuộn bụng|gập bụng/, c: ['co'], p: ['vai', 'lx'] },
        { re: /farmer|carry|mang tạ/, c: ['th', 'co'], p: ['tay', 'mong', 'qd'] },
        { re: /calf|bắp chân|kiễng/, c: ['bc'], p: [] },
        { re: /single.?leg balance|đứng một chân/, c: ['mong'], p: ['bc', 'co'] },
        { re: /rdl|romanian|deadlift|good morning/, c: ['hs', 'mong'], p: ['co', 'th'] },
        { re: /hip thrust|glute|cầu mông/, c: ['mong'], p: ['hs'] },
        { re: /leg curl/, c: ['hs'], p: ['bc'] },
        { re: /leg extension|leg press/, c: ['qd'], p: ['mong'] },
        { re: /jump squat|jump|nhảy/, c: ['qd', 'mong', 'bc'], p: ['hs', 'co'] },
        { re: /bulgar|split squat|lunge|step.?up|chùng/, c: ['qd', 'mong'], p: ['hs', 'bc', 'co'] },
        { re: /goblet|front squat/, c: ['qd', 'mong'], p: ['hs', 'co'] },
        { re: /squat/, c: ['qd', 'mong'], p: ['hs', 'bc', 'co'] }
    ];
    function nhomTheoBaiTap(ten) {
        const t = ten.toLowerCase();
        const r = LUAT_BAI_TAP.find(x => x.re.test(t));
        return r || null;
    }
    // Bài tập trong lịch bổ trợ (Thức giấc, Golf): lấy phần tên trước dấu ":" ở mỗi dòng
    function baiTapBoTro(ngay) {
        const ds = [];
        RT_KEYS.forEach(k => {
            const rt = state.lich_bo_tro[k];
            if (!rt.ngay.includes(ngay)) return;
            String(rt.noi_dung || '').split('\n').forEach(l => {
                const m = l.match(/^\s*([^:]{2,40}):/);
                if (m) ds.push(m[1].trim());
            });
        });
        return ds;
    }
    // ---------- Đọc số rep từ nội dung lịch (tự cập nhật mỗi khi mở Thống kê) ----------
    const BUOI_TEN = { 'sáng': 'sáng', 'trưa': 'trưa', 'chiều': 'chiều', 'tối': 'tối' };
    function soRepSau(sau) {
        // bỏ chữ ghi chú đứng giữa tên bài và số (ví dụ "Chống đẩy chiều (30 cái)", "Chống đẩy trong ngày 4x10")
        sau = sau.replace(/^\s*(?:chiều|trong ngày|sáng|trưa|tối|vp|không tạ)\s*/i, '');
        let m = sau.match(/^\s*\(?\s*(\d+)\s*[x×]\s*(\d+)/i);
        if (m) return (+m[1]) * (+m[2]);
        m = sau.match(/^\s*\(?\s*(\d+)\s*(?:cái|rep|lần)\b/i);
        return m ? +m[1] : null;
    }
    const SQUAT_MOI_BUOI_TAICHI = 40;   // mức mặc định nếu động tác Taichi chưa có nội dung
    // Số Squat của một buổi Taichi: cộng các động tác có chữ "Squat" trong nội dung động tác Taichi
    // (ví dụ "Squat, tay vươn nở hoa 1x20; Squat, tay lên xuống cắt chéo 1x20" = 40). Sửa nội dung Taichi thì thống kê tự đổi theo.
    function squatMoiBuoiTaichi() {
        const ten = Object.keys(state.dong_tac).find(n => /tai ?chi/i.test(n));
        const nd = ten ? String(state.dong_tac[ten].ghi_chu || '').trim() : '';
        if (!nd) return SQUAT_MOI_BUOI_TAICHI;
        let tong = 0;
        nd.split(/[;\n]+/).forEach(seg => {
            if (!/squat/i.test(seg)) return;
            const m = seg.match(/(\d+)\s*[x×]\s*(\d+)/i);
            if (m) { tong += (+m[1]) * (+m[2]); return; }
            const m2 = seg.match(/(\d+)\s*(?:cái|rep|lần)\b/i);
            if (m2) tong += +m2[1];
        });
        return tong;
    }
    // Trả về { 'Tên': số rep } của một ngày, cho Squat và Chống đẩy.
    // Chống đẩy luôn là "Chống đẩy", rep = số set × rep ghi bên cạnh.
    // Taichi tính bằng 40 Squat mỗi buổi và cộng thêm Squat ghi riêng.
    function repTuTrongNgay(ngay) {
        const out = {};
        let coTaichi = state.days[ngay].bai_tap.some(n => /tai ?chi/i.test(n));
        String(state.days[ngay].noi_dung || '').split('\n').forEach(line => {
            const m = line.match(/^\s*(sáng|trưa|chiều|tối)[^:]*:\s*(.*)$/i);
            const body = m ? m[2] : line;
            if (/tai ?chi/i.test(body)) coTaichi = true;
            const best = {};
            // các phương án cách nhau dấu "/" là lựa chọn thay thế (ví dụ "Xe đạp 9.5km / Squat 1x30" quy đổi thành Squat 1x30): lấy phương án nhiều rep nhất
            body.split('/').forEach(alt => {
                const cur = {};
                const low = alt.toLowerCase();
                const re = /chống đẩy|squat( không tạ)?/g;
                let x;
                while ((x = re.exec(low)) !== null) {
                    if (x[0].startsWith('squat') && /(goblet|jump|split|front|bulgar\w*)\s*$/.test(low.slice(Math.max(0, x.index - 12), x.index))) continue;
                    const reps = soRepSau(low.slice(x.index + x[0].length, x.index + x[0].length + 24));
                    if (reps === null) continue;
                    const ten = x[0].startsWith('squat') ? 'Squat' : 'Chống đẩy';
                    cur[ten] = (cur[ten] || 0) + reps;
                }
                Object.keys(cur).forEach(t => { best[t] = Math.max(best[t] || 0, cur[t]); });
            });
            Object.keys(best).forEach(t => { out[t] = (out[t] || 0) + best[t]; });
        });
        if (coTaichi) { const sq = squatMoiBuoiTaichi(); if (sq > 0) out['Squat'] = (out['Squat'] || 0) + sq; }
        return out;
    }
    // Rep của bài tập có tạ ghi dạng "Tên (3x6)" hoặc "Tên 3x6" trong nội dung ngày
    function repBaiTapCoTa(ngay, ten) {
        const low = String(state.days[ngay].noi_dung || '').toLowerCase(), t = ten.toLowerCase();
        let idx = low.indexOf(t), tong = 0, found = false;
        while (idx !== -1) {
            const r = soRepSau(low.slice(idx + t.length, idx + t.length + 14));
            if (r !== null) { tong += r; found = true; }
            idx = low.indexOf(t, idx + t.length);
        }
        return found ? tong : null;
    }

    function tinhNhomCoTheoBaiTap() {
        const res = {}, khongRo = new Set(), repTT = {};
        NHOM_CO_LON.forEach(([k]) => { res[k] = { chinh: new Set(), phu: new Set(), ds: new Set(), kl: 0 }; });
        DAYS.forEach(ngay => {
            const vol = {};   // rep của từng bài trong ngày để tính khối lượng
            const tt = repTuTrongNgay(ngay);
            Object.keys(tt).forEach(k => {
                (repTT[k] = repTT[k] || { ten: k, ngay: {} }).ngay[ngay] = tt[k];
                vol[k] = (vol[k] || 0) + tt[k];
            });
            const names = state.days[ngay].bai_tap.concat(baiTapBoTro(ngay), Object.keys(vol));
            const chinhNgay = new Set(), phuNgay = new Set();
            Array.from(new Set(names)).forEach(n => {
                const r = nhomTheoBaiTap(n);
                if (!r) { if (!/mobility|xoay khớp|golf|putt|gậy|bóng|mô phỏng|balance/i.test(n)) khongRo.add(n); return; }
                // Taichi đã quy đổi thành Squat nên không cộng rep lần nữa
                const reps = /tai ?chi/i.test(n) ? null : (vol[n] !== undefined ? vol[n] : repBaiTapCoTa(ngay, n));
                r.c.forEach(k => { chinhNgay.add(k); res[k].ds.add(n); if (reps) res[k].kl += reps; });
                r.p.forEach(k => { phuNgay.add(k); res[k].ds.add(n); if (reps) res[k].kl += reps * 0.5; });
            });
            chinhNgay.forEach(k => res[k].chinh.add(ngay));
            phuNgay.forEach(k => { if (!chinhNgay.has(k)) res[k].phu.add(ngay); });
        });
        const ds = NHOM_CO_LON.map(([k, ten, mota], i) => ({ k, ten, mota, thuTuLon: i, kl: res[k].kl, chinh: Array.from(res[k].chinh), phu: Array.from(res[k].phu), bai: Array.from(res[k].ds) }));
        ds.sort((a, b) => b.chinh.length - a.chinh.length || b.kl - a.kl || (b.chinh.length + b.phu.length) - (a.chinh.length + a.phu.length) || a.thuTuLon - b.thuTuLon);
        return { ds, khongRo: Array.from(khongRo), repTT };
    }
    function nhomCoHtml() {
        const { ds, khongRo, repTT } = tinhNhomCoTheoBaiTap();
        const bars = ds.map((g, i) => `
            <div class="bar-row ${g.chinh.length + g.phu.length === 0 ? 'zero' : ''}">
                <div class="rank">${i + 1}</div>
                <div class="bar-label">${escapeHtml(g.ten)}</div>
                <div class="bar-track stack"><div class="bar-fill chinh" style="width:${g.chinh.length / DAYS.length * 100}%"></div><div class="bar-fill phu" style="width:${g.phu.length / DAYS.length * 100}%"></div></div>
                <div class="bar-value wide">${g.chinh.length} chính${g.phu.length ? ' + ' + g.phu.length + ' phụ' : ''}</div>
            </div>`).join('');
        const rows = ds.map((g, i) => `<tr><td class="num">${i + 1}</td><td><strong>${escapeHtml(g.ten)}</strong><div class="mus-ex">${escapeHtml(g.mota)}</div></td><td class="num">${g.chinh.length}</td><td class="num">${g.phu.length}</td><td class="num">${g.kl ? fmt(Math.round(g.kl)) : '–'}</td><td>${escapeHtml(g.chinh.concat(g.phu).join(', ') || '–')}<div class="mus-ex">${escapeHtml(g.bai.join(', '))}</div></td></tr>`).join('');
        const keys = Object.keys(repTT).sort((a, b) => a.localeCompare(b, 'vi'));
        const bangRep = keys.length ? `<div class="stat-h">Rep tự trọng trong tuần</div>
            <div class="scroll"><table><thead><tr><th>Bài tập</th>${DAYS.map(d => `<th>${escapeHtml(d.replace('Thứ ', 'T').replace('Chủ Nhật', 'CN'))}</th>`).join('')}<th>Tổng</th></tr></thead><tbody>${keys.map(k => {
                const r = repTT[k], tong = DAYS.reduce((t, d) => t + (r.ngay[d] || 0), 0);
                return `<tr><td><strong>${escapeHtml(k)}</strong></td>${DAYS.map(d => `<td class="num">${r.ngay[d] ? fmt(r.ngay[d]) : '–'}</td>`).join('')}<td class="num"><strong>${fmt(tong)}</strong></td></tr>`;
            }).join('')}</tbody></table></div>
            <div class="mus-note">Số rep đọc trực tiếp từ nội dung lịch từng ngày (ví dụ "Squat 1x30", "Chống đẩy chiều (30 cái)", "Chống đẩy trong ngày 4x10"). Chống đẩy luôn là Chống đẩy, rep bằng số set × rep ghi bên cạnh. Mỗi buổi Taichi tính bằng 40 Squat, cộng với Squat ghi riêng: Taichi cùng "Xe đạp 9.5km / Squat 1x30" là 40 + 30 = 70 Squat. Mục "Xe đạp 9.5km / Squat 1x30" quy đổi thành Squat 1x30. Sửa lịch rồi mở lại Thống kê, số liệu tự cập nhật.</div>` : '';
        return `<div class="mus-note">Dựa trên tên từng bài tập (kể cả bài trong lịch Thức giấc và Golf). "Chính" là số ngày trong tuần bài tập tác động trực tiếp, "phụ" là số ngày nhóm cơ chỉ hỗ trợ (không tính trùng với ngày chính). "Rep quy đổi" là tổng rep của các bài có ghi số rep (bài chính tính 1, bài phụ tính 0,5). Xếp hạng theo số buổi chính, rồi rep quy đổi, rồi tổng buổi, rồi kích thước nhóm cơ.</div>${bars}
            <div class="scroll"><table><thead><tr><th>Hạng</th><th>Nhóm cơ</th><th>Buổi chính</th><th>Buổi phụ</th><th>Rep quy đổi</th><th>Các ngày và bài tập</th></tr></thead><tbody>${rows}</tbody></table></div>`
            + (khongRo.length ? `<div class="mus-note">Chưa nhận diện được nhóm cơ của: ${khongRo.map(escapeHtml).join(', ')}.</div>` : '')
            + bangRep;
    }

    function moThongKe() {
        const { activities, routines } = tinhThongKe();
        openModal(`
            <h3>Thống kê trong tuần</h3>

            <div class="stat-h">Hoạt động khác (thể lực, hồi phục)</div>${thongKeHtml(activities, 'activity')}
            <div class="stat-h">Lịch bổ trợ (Thức giấc, Golf)</div>${thongKeHtml(routines, 'routine')}

    }

    // ---------- InBody: tải ảnh và phân tích ----------
    let sampleFn = null, sampleImg = false, sampleAccept = 'image/*', assetsNs = null, downloadsNs = null;
    let scans = [];
    let ibCap = 10;
    let ibFiles = [], ibMax = 6, ibCtl = null, ibBusy = false, ibDelArm = null;

    const NHAN_DANH_GIA = { thap: 'Thấp', binh_thuong: 'Bình thường', cao: 'Cao', khong_ro: 'Chưa rõ' };

    // 15 chỉ số duy nhất được đọc từ phiếu InBody. Tên được chuẩn hoá để so sánh giữa các lần đo.
    const PHAN_DOAN = [['tay trái', /(tay trái|left arm)/], ['tay phải', /(tay phải|right arm)/], ['thân', /(thân|trunk)/], ['chân trái', /(chân trái|left leg)/], ['chân phải', /(chân phải|right leg)/]];
    const CHI_SO_BAT_BUOC = [
        ['pbf', 'PBF (tỷ lệ mỡ cơ thể)'], ['smm', 'SMM (khối lượng cơ xương)'], ['fm', 'Khối lượng mỡ'], ['vfa', 'VFA (vùng mỡ nội tạng)'],
        ['weight', 'Cân nặng'], ['bmi', 'BMI'], ['seg', 'Phân đoạn cơ nạc (tay trái, tay phải, thân, chân trái, chân phải)'],
        ['ecw', 'Tỷ lệ nước ngoại bào (ECW)'], ['ffm', 'Khối lượng không mỡ (FFM)'], ['tbw', 'Tổng lượng nước cơ thể'], ['protein', 'Protein'],
        ['mineral', 'Khoáng chất'], ['bmr', 'BMR'], ['smi', 'SMI'], ['score', 'Điểm InBody']
    ];
    // Trả về { key, ten, nhom, donVi } hoặc null nếu không thuộc 15 chỉ số
    function chuanChiSo(tenRaw, donViRaw) {
        const t = String(tenRaw || '').toLowerCase().trim(), dv = String(donViRaw || '').toLowerCase();
        const phanTram = dv.includes('%') || /%|so với|chuẩn/.test(t);
        if (!t) return null;
        // phân đoạn cơ nạc (không lấy mỡ phân đoạn)
        if (/(cơ|lean|muscle)/.test(t) && !/(mỡ|fat)/.test(t)) {
            const pd = PHAN_DOAN.find(x => x[1].test(t));
            if (pd) return { key: 'seg', ten: 'Cơ nạc ' + pd[0] + (phanTram ? ' (%)' : ' (kg)'), nhom: 'Phân đoạn cơ nạc' };
        }
        if (/(mỡ|fat)/.test(t) && /(tay|chân|thân|arm|leg|trunk)/.test(t)) return null;
        if (/smi|chỉ số cơ xương|skeletal muscle index/.test(t)) return { key: 'smi', ten: 'SMI (chỉ số cơ xương)', nhom: 'Cơ - mỡ' };
        if (/pbf|tỷ lệ mỡ|% mỡ|phần trăm mỡ|percent body fat|body fat percent/.test(t)) return { key: 'pbf', ten: 'PBF (tỷ lệ mỡ cơ thể)', nhom: 'Cơ - mỡ' };
        if (/vfa|vga|visceral|vùng mỡ nội tạng|diện tích mỡ nội tạng|mỡ nội tạng/.test(t)) return { key: 'vfa', ten: 'VFA (vùng mỡ nội tạng)', nhom: 'Cơ - mỡ' };
        if (/ffm|không mỡ|fat.?free/.test(t)) return { key: 'ffm', ten: 'Khối lượng không mỡ (FFM)', nhom: 'Thành phần cơ thể' };
        if (/smm|skeletal muscle mass|cơ xương|khối lượng cơ/.test(t)) return { key: 'smm', ten: 'SMM (khối lượng cơ xương)', nhom: 'Cơ - mỡ' };
        if (/fat mass|khối lượng mỡ|lượng mỡ|\bfm\b/.test(t)) return { key: 'fm', ten: 'Khối lượng mỡ', nhom: 'Cơ - mỡ' };
        if (/bmi/.test(t)) return { key: 'bmi', ten: 'BMI', nhom: 'Thành phần cơ thể' };
        if (/ecw|ngoại bào|ngoài tế bào/.test(t)) return { key: 'ecw', ten: 'Tỷ lệ nước ngoại bào (ECW)', nhom: 'Thành phần cơ thể' };
        if (/tbw|total body water|tổng lượng nước|nước toàn|nước cơ thể/.test(t)) return { key: 'tbw', ten: 'Tổng lượng nước cơ thể', nhom: 'Thành phần cơ thể' };
        if (/protein|đạm/.test(t)) return { key: 'protein', ten: 'Protein', nhom: 'Thành phần cơ thể' };
        if (/khoáng|mineral/.test(t)) return { key: 'mineral', ten: 'Khoáng chất', nhom: 'Thành phần cơ thể' };
        if (/bmr|chuyển hóa cơ bản|basal/.test(t)) return { key: 'bmr', ten: 'BMR (chuyển hóa cơ bản)', nhom: 'Khác' };
        if (/inbody score|điểm inbody|điểm số|^điểm|score/.test(t)) return { key: 'score', ten: 'Điểm InBody', nhom: 'Khác' };
        if (/vòng mông|vòng hông|mông|\bhips?\b/.test(t) && !/whr|tỷ lệ/.test(t)) return { key: 'hip', ten: 'Vòng mông', nhom: 'Số đo vòng' };
        if (/vòng ngực|ngực|\bchest\b|\bbust\b/.test(t)) return { key: 'chest', ten: 'Vòng ngực', nhom: 'Số đo vòng' };
        if (/vòng vai|\bvai\b|shoulder/.test(t)) return { key: 'shoulder', ten: 'Vòng vai', nhom: 'Số đo vòng' };
        if (/vòng eo|waist|eo\b/.test(t) && !/hông|whr|hip/.test(t)) return { key: 'waist', ten: 'Vòng eo', nhom: 'Số đo vòng' };
        if (/cân nặng|weight|^wt/.test(t)) return { key: 'weight', ten: 'Cân nặng', nhom: 'Thành phần cơ thể' };
        return null;
    }
    // Các chỉ số bắt buộc còn thiếu trong một lần đọc
    function chiSoConThieu(chi_so) {
        const co = new Set(), seg = new Set();
        chi_so.forEach(c => { const n = chuanChiSo(c.ten, c.don_vi); if (!n) return; co.add(n.key); if (n.key === 'seg') seg.add(n.ten.replace(/ \((kg|%)\)$/, '')); });
        return CHI_SO_BAT_BUOC.filter(([k]) => k === 'seg' ? seg.size < 5 : !co.has(k)).map(x => x[1]);
    }
    function chuanHoaPhanTich(a) {
        const s = v => v == null ? '' : String(v).trim();
        const arr = v => Array.isArray(v) ? v.map(s).filter(Boolean).slice(0, 12) : [];
        const ds = ['thap', 'binh_thuong', 'cao', 'khong_ro'];
        a = a && typeof a === 'object' ? a : {};
        const loaiOk = ['inbody', 'co_the', 'khac'];
        const loai = loaiOk.includes(s(a.loai)) ? s(a.loai) : (a.la_phieu_inbody === false || a.la_phieu === false ? 'khac' : 'inbody');
        return {
            loai: loai,
            ngay_do: s(a.ngay_do),
            chi_so: (() => {
                const seen = new Set(), out = [];
                (Array.isArray(a.chi_so) ? a.chi_so : []).slice(0, 200).forEach(x => {
                    x = x && typeof x === 'object' ? x : {};
                    const dg = s(x.danh_gia), ten = s(x.ten), gt = s(x.gia_tri);
                    if (!ten || !gt) return;
                    const n = chuanChiSo(ten, s(x.don_vi));
                    if (!n || seen.has(n.ten)) return;
                    seen.add(n.ten);
                    out.push({ nhom: n.nhom, ten: n.ten, gia_tri: gt, don_vi: s(x.don_vi), pham_vi: s(x.pham_vi), danh_gia: ds.includes(dg) ? dg : 'khong_ro' });
                });
                return out;
            })(),
            quan_sat: arr(a.quan_sat),
            chat_luong: (() => {
                const q = a.chat_luong && typeof a.chat_luong === 'object' ? a.chat_luong : {};
                return { dat: q.dat !== false, van_de: arr(q.van_de), khong_doc_duoc: arr(q.khong_doc_duoc) };
            })(),
            tong_quan: s(a.tong_quan),
            diem_tot: arr(a.diem_tot),
            can_luu_y: arr(a.can_luu_y),
            goi_y_tap: arr(a.goi_y_tap)
        };
    }

    function promptInBody(moTa) {
        return `Bạn đọc dữ liệu từ ảnh để người dùng theo dõi thành phần cơ thể theo thời gian. KHÔNG đánh giá, KHÔNG nhận xét tốt hay xấu, KHÔNG gợi ý. Chỉ trích xuất đúng số liệu nhìn thấy.

Nếu là phiếu InBody, CHỈ đọc đúng 18 mục sau, KHÔNG đọc mục nào khác (bỏ qua mọi chỉ số còn lại trên phiếu):

12. BMR, chuyển hóa cơ bản (kcal): ten "BMR"

17. Vòng ngực (cm): ten "Vòng ngực". Tự đo, ghi tay, KHÔNG bắt buộc, cùng quy tắc.
18. Vòng vai (cm): ten "Vòng vai". Tự đo, ghi tay, KHÔNG bắt buộc, cùng quy tắc.
- Chỉ ghi giá trị nhìn thấy rõ, KHÔNG bịa số. Mục nào có trên phiếu nhưng không đọc chắc chắn được thì đưa tên mục đó vào "khong_doc_duoc". Nếu có nhiều phiếu, đọc phiếu rõ nhất hoặc mới nhất.
- "ngay_do": ngày đo in trên phiếu, định dạng YYYY-MM-DD nếu đọc được, nếu không thì chuỗi rỗng.
- "gia_tri": chỉ chữ số và dấu chấm thập phân. "don_vi": kg, %, cm², cm, L, kcal, kg/m², điểm hoặc rỗng. "pham_vi": khoảng bình thường in trên phiếu, nếu không có thì rỗng.
- "nhom": "Thành phần cơ thể", "Cơ - mỡ", "Phân đoạn cơ nạc", "Số đo vòng" (cho các vòng tự đo) hoặc "Khác".

Nếu là ảnh cơ thể:
- "quan_sat": 3 đến 8 mô tả khách quan, ngắn, về những gì nhìn thấy (góc chụp, tư thế vai và lưng, độ rõ tương đối của từng nhóm cơ, sự đối xứng trái phải, vùng bụng hông). Không ước tính số đo hay tỷ lệ mỡ bằng số, không khen chê. "chi_so": [].

Kiểm tra chất lượng ảnh, trung thực, đặt "chat_luong":
- "dat": false nếu ảnh quá mờ, bị chói lóa hoặc che khuất, tối, bị cắt mất phần phiếu, chụp nghiêng làm chữ méo, hoặc chữ nhỏ đến mức không đọc chắc chắn được. Ngược lại đặt true.
- "van_de": các lỗi cụ thể bằng tiếng Việt, ngắn (ví dụ "Ảnh bị mờ ở nửa dưới phiếu", "Phiếu bị cắt mất phần phân đoạn cơ nạc"). Không tính các vòng tự đo (eo, mông, ngực, vai) vào lỗi.
- "khong_doc_duoc": tên các mục bắt buộc (trừ các vòng tự đo: eo, mông, ngực, vai) mà không đọc được.

Chỉ trả về MỘT đối tượng JSON, đúng dạng:
{"loai": "inbody", "ngay_do": "", "chi_so": [{"nhom": "Cơ - mỡ", "ten": "PBF", "gia_tri": "18.5", "don_vi": "%", "pham_vi": "10.0 - 20.0"}], "quan_sat": [""], "chat_luong": {"dat": true, "van_de": [""], "khong_doc_duoc": [""]}}`;
    }

    // Ảnh lớn được cắt thành các dải chồng lấn để chữ nhỏ vẫn rõ khi Claude nhận ảnh đã giảm kích thước
    async function chuanBiAnh(file) {
        const out = { w: 0, h: 0, whole: null, bands: [] };
        let bmp = null;
        try { bmp = await createImageBitmap(file); } catch (e) { out.whole = file; return out; }
        out.w = bmp.width; out.h = bmp.height;
        out.whole = await thuNhoAnh(file, 2000);
        const px = bmp.width * bmp.height;
        if (px > 1.5e6 && Math.min(bmp.width, bmp.height) >= 600) {
            const doc = bmp.height >= bmp.width, dai = doc ? bmp.height : bmp.width, ngan = doc ? bmp.width : bmp.height;
            const k = 3, ov = 0.15, seg = dai / (k - (k - 1) * ov);
            for (let i = 0; i < k; i++) {
                const start = Math.min(dai - seg, i * seg * (1 - ov)), sw = doc ? ngan : seg, sh = doc ? seg : ngan;
                const sx = doc ? 0 : start, sy = doc ? start : 0;
                const sc = Math.min(1, 1800 / Math.max(sw, sh));
                const c = document.createElement('canvas');
                c.width = Math.max(1, Math.round(sw * sc)); c.height = Math.max(1, Math.round(sh * sc));
                c.getContext('2d').drawImage(bmp, sx, sy, sw, sh, 0, 0, c.width, c.height);
                const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
                if (blob) out.bands.push({ blob: blob, ten: doc ? ['phần trên', 'phần giữa', 'phần dưới'][i] : ['phần trái', 'phần giữa', 'phần phải'][i] });
            }
        }
        if (bmp.close) bmp.close();
        return out;
    }

    // Kiểm tra kết quả: ảnh có đủ chất lượng để dùng không
    function kiemTraChatLuong(an) {
        const ly = [];
        if (an.loai === 'khac') ly.push('Không nhận ra đây là phiếu InBody hoặc ảnh chụp cơ thể.');
        if (!an.chat_luong.dat) an.chat_luong.van_de.forEach(x => ly.push(x));
        if (an.loai === 'inbody') {
            const thieu = chiSoConThieu(an.chi_so);
            if (thieu.length) ly.push('Chưa đọc được các chỉ số cần theo dõi: ' + thieu.join('; ') + '. Hãy gửi lại ảnh phiếu rõ hơn.');
        }
        if (an.loai === 'co_the' && !an.quan_sat.length) ly.push('Không nhìn rõ hình thể trong ảnh.');
        if (!an.chat_luong.dat && !ly.length) ly.push('Ảnh chưa đủ rõ để đọc chắc chắn.');
        return { ok: ly.length === 0, ly_do: ly };
    }
    function canhBaoAnhKem(ly) {
        return `<div class="notice"><b>Ảnh chưa đủ chất lượng nên chưa lưu kết quả.</b><ul class="ib-list">${ly.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>Hãy chụp lại hoặc chọn ảnh khác: đủ sáng, chụp thẳng góc, không chói lóa, thấy trọn cả phiếu và chữ nét. Bấm "Xóa hết ảnh" hoặc × trên ảnh cũ, rồi "Thêm ảnh" để đưa ảnh mới lên.</div>`;
    }

    function loiSample(e) {
        switch (e && e.code) {
            case 'not_granted': return 'Trang chưa được phép dùng Claude. Bấm Phân tích lại và chọn Cho phép.';
            case 'rate_limited': return 'Đã gọi quá nhiều lần hoặc chạm giới hạn sử dụng. Thử lại sau ít phút.';
            case 'image_rejected': return 'Không dùng được ảnh này. Hãy chọn ảnh JPEG, PNG hoặc WebP rõ nét.';
            case 'images_unavailable': return 'Bản xem này chưa gửi được ảnh cho Claude. Mở trang trong ứng dụng hoặc trên claude.ai.';
            case 'invalid_json': return 'Claude trả lời không đúng định dạng. Bấm Phân tích để thử lại.';
            case 'refused': return 'Claude không xử lý được ảnh này. Thử ảnh khác.';
            case 'session_expired': return 'Phiên đăng nhập đã hết hạn. Tải lại trang rồi thử lại.';
            case 'sampling_disabled': return 'Tài khoản này không dùng được Claude trong trang.';
            case 'empty_completion': return 'Claude không trả về nội dung. Thử lại với ảnh rõ hơn.';
            default: return 'Phân tích chưa thành công. Thử lại sau.';
        }
    }

    async function thuNhoAnh(file, maxEdge) {
        try {
            const bmp = await createImageBitmap(file);
            const scale = Math.min(1, maxEdge / Math.max(bmp.width, bmp.height));
            if (scale >= 1 && file.size <= 3 * 1024 * 1024 && file.type === 'image/jpeg') { if (bmp.close) bmp.close(); return file; }
            const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(bmp, 0, 0, w, h);
            if (bmp.close) bmp.close();
            const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
            return blob || file;
        } catch (e) { return file; }
    }

    function ketQuaHtml(an) {
        if (an.loai === 'khac' && !an.chi_so.length && !an.quan_sat.length) {
            return `<div class="notice">Chưa đọc được dữ liệu từ ảnh này. Hãy chọn ảnh cơ thể hoặc phiếu InBody rõ nét.</div>`;
        }
        const nhom = [];
        an.chi_so.forEach(c => { let g = nhom.find(x => x.ten === c.nhom); if (!g) { g = { ten: c.nhom, ds: [] }; nhom.push(g); } g.ds.push(c); });
        const bang = nhom.map(g => `
            <div class="ib-group">${escapeHtml(g.ten)}</div>
            <div class="scroll"><table>
                <thead><tr><th>Chỉ số</th><th>Giá trị</th><th>Phạm vi trên phiếu</th></tr></thead>
                <tbody>${g.ds.map(c => `
                    <tr>
                        <td>${escapeHtml(c.ten)}</td>
                        <td class="num"><strong>${escapeHtml(c.gia_tri)}</strong> ${escapeHtml(c.don_vi)}</td>
                        <td class="num">${escapeHtml(c.pham_vi) || '–'}</td>
                    </tr>`).join('')}
                </tbody>
            </table></div>`).join('');
        const qs = an.quan_sat.length ? `<h4>Ghi nhận từ ảnh cơ thể</h4><ul class="ib-list">${an.quan_sat.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>` : '';
        const nhanLoai = an.loai === 'co_the' ? 'Ảnh cơ thể' : 'Phiếu InBody';
        return `<div class="small"><span class="pill p-binh_thuong">${nhanLoai}</span></div>`
            + (an.ngay_do && an.loai !== 'co_the' ? `<div class="small">Ngày đo trên phiếu: ${escapeHtml(an.ngay_do)}</div>` : '')
            + (an.chat_luong.khong_doc_duoc.length ? `<div class="notice">Chưa đọc được: ${an.chat_luong.khong_doc_duoc.map(escapeHtml).join(', ')}. Nếu cần đủ số liệu, hãy chụp lại rõ hơn và phân tích lại.</div>` : '')
            + bang + qs
            + `<p class="small">Số liệu do Claude đọc từ ảnh, hãy đối chiếu lại với phiếu gốc. Nội dung chỉ để tham khảo, không thay cho tư vấn y tế.</p>`;
    }

    function hienKetQua(an) {
        const el = $('ib-result');
        if (el) el.innerHTML = ketQuaHtml(an);
    }
    function trangThai(msg, isErr) {
        const el = $('ib-status');
        if (!el) return;
        el.textContent = msg || '';
        el.className = 'small' + (isErr ? ' err' : '');
    }
    function nutChay(dangChay) {
        const run = $('ib-run'), stop = $('ib-stop');
        if (run) { run.disabled = dangChay || !ibFiles.length; run.textContent = ibFiles.length > 1 ? 'Phân tích ' + ibFiles.length + ' ảnh' : 'Phân tích'; }
        const clr = $('ib-clear'); if (clr) clr.disabled = dangChay || !ibFiles.length;
        const xh = $('ib-xh-run'); if (xh) xh.disabled = dangChay || !sampleFn;
        if (stop) stop.hidden = !dangChay;
    }

    const HEX32 = /^[0-9a-f]{32}$/;
    function idsAnh(sc) {
        const out = [];
        if (Array.isArray(sc.anhs)) sc.anhs.forEach(x => { if (typeof x === 'string' && HEX32.test(x) && !out.includes(x)) out.push(x); });
        if (typeof sc.anh === 'string' && HEX32.test(sc.anh) && !out.includes(sc.anh)) out.unshift(sc.anh);
        return out;
    }

    // ---------- So sánh các lần theo thời gian ----------
    let xuHuong = null;

    function soTuChuoi(v) {
        const m = String(v == null ? '' : v).replace(/,/g, '.').match(/-?\d+(?:\.\d+)?/);
        return m ? parseFloat(m[0]) : null;
    }
    function moc2(n) { return String(n).padStart(2, '0'); }
    function thoiDiemLan(sc, an) {
        const dt = an.ngay_do || '';
        let m = dt.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/), y, mo, d;
        if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
        else if ((m = dt.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))) { d = +m[1]; mo = +m[2]; y = +m[3]; }
        if (y && mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return { t: Date.UTC(y, mo - 1, d), nhan: moc2(d) + '/' + moc2(mo) + '/' + String(y).slice(2) };
        const c = new Date(sc.createdAt || Date.now());
        return { t: Date.UTC(c.getFullYear(), c.getMonth(), c.getDate()), nhan: moc2(c.getDate()) + '/' + moc2(c.getMonth() + 1) + '/' + String(c.getFullYear()).slice(2) };
    }
    // Gom dữ liệu: các lần đo xếp theo thời gian và danh sách chỉ số
    function gomSoLieu(list) {
        const lans = list.map(sc => {
            const an = chuanHoaPhanTich(sc.phan_tich), tg = thoiDiemLan(sc, an);
            return { t: tg.t, nhan: tg.nhan, ca: sc.createdAt || 0, an: an };
        }).filter(x => x.an.chi_so.length || x.an.quan_sat.length).sort((a, b) => a.t - b.t || a.ca - b.ca);
        const map = new Map();
        lans.forEach((l, i) => l.an.chi_so.forEach(c => {
            const v = soTuChuoi(c.gia_tri);
            if (v === null) return;
            const key = c.ten.toLowerCase() + '|' + c.don_vi.toLowerCase();
            let m = map.get(key);
            if (!m) { m = { ten: c.ten, don_vi: c.don_vi, nhom: c.nhom, pts: [] }; map.set(key, m); }
            if (!m.pts.some(p => p.i === i)) m.pts.push({ i: i, v: v, nhan: l.nhan });
        }));
        return { lans: lans, metrics: Array.from(map.values()) };
    }
    const SO_LAN_TOI_THIEU = 2;
    function demLanInBody(list) { return gomSoLieu(list).lans.filter(l => l.an.chi_so.length).length; }
    function thongBaoThieuDuLieu(n) { return `Cần có thêm dữ liệu để so sánh. Cần ít nhất ${SO_LAN_TOI_THIEU} lần đo InBody, hiện có ${n}.`; }
    const thapPhan = n => fmt(Math.round(n * 100) / 100);

    function veBieuDo(m) {
        const W = 300, H = 132, L = 14, R = 14, T = 22, B = 24;
        const pts = m.pts, n = pts.length;
        const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1;
        const X = i => n === 1 ? W / 2 : L + (W - L - R) * i / (n - 1);
        const Y = v => T + (H - T - B) * (1 - (v - lo) / span);
        const dem = pts.map((p, i) => X(i).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ');
        const all = n <= 5;
        const nhanPt = (p, i) => {
            const x = X(i), anc = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
            const hienGT = all || i === 0 || i === n - 1, hienNgay = all || i === 0 || i === n - 1;
            return (hienGT ? `<text x="${x.toFixed(1)}" y="${(Y(p.v) - 7).toFixed(1)}" text-anchor="${anc}" font-size="10" font-weight="700" fill="var(--ink)">${escapeHtml(thapPhan(p.v))}</text>` : '')
                + (hienNgay ? `<text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="${anc}" font-size="9.5" fill="var(--ink-2)">${escapeHtml(p.nhan)}</text>` : '');
        };
        return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ ${escapeHtml(m.ten)} theo thời gian" style="display:block;max-width:100%">
            <line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>
            <line x1="${L}" x2="${W - R}" y1="${T}" y2="${T}" stroke="var(--line)" stroke-dasharray="3 3"/>
            ${n > 1 ? `<polyline points="${dem}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
            ${pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i === n - 1 ? 4.5 : 3}" fill="${i === n - 1 ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>${nhanPt(p, i)}`).join('')}
        </svg>`;
    }

    function soSanhHtml(list) {
        list = list.filter(sc => chuanHoaPhanTich(sc.phan_tich).chi_so.length);
        const g = gomSoLieu(list), lans = g.lans;
        const coSoLieu = g.metrics.filter(m => m.pts.length >= 2);
        if (lans.length < SO_LAN_TOI_THIEU) return `<p class="empty">${thongBaoThieuDuLieu(lans.length)}</p>`;
        if (!g.metrics.length) return '<p class="empty">Chưa có chỉ số dạng số để so sánh. Biểu đồ sẽ hiện khi có từ 2 phiếu InBody trở lên.</p>';
        const nhom = [];
        g.metrics.forEach(m => { let x = nhom.find(y => y.ten === m.nhom); if (!x) { x = { ten: m.nhom, ds: [] }; nhom.push(x); } x.ds.push(m); });
        const delta = m => {
            if (m.pts.length < 2) return '–';
            const a = m.pts[0].v, b = m.pts[m.pts.length - 1].v, d = b - a;
            const pc = a !== 0 ? ' (' + (d > 0 ? '+' : d < 0 ? '−' : '') + thapPhan(Math.abs(d / a * 100)) + '%)' : '';
            return (d > 0 ? '+' : d < 0 ? '−' : '') + thapPhan(Math.abs(d)) + ' ' + escapeHtml(m.don_vi) + pc;
        };
        const cols = lans.map((l, i) => i);
        const bang = `<div class="scroll"><table class="cmp-table"><thead><tr><th>Chỉ số</th>${lans.map(l => `<th>${escapeHtml(l.nhan)}</th>`).join('')}<th>Thay đổi (đầu → cuối)</th></tr></thead><tbody>${
            nhom.map(x => `<tr><td colspan="${lans.length + 2}" class="ib-group" style="padding:6px 8px">${escapeHtml(x.ten)}</td></tr>` + x.ds.map(m => `<tr><td>${escapeHtml(m.ten)}${m.don_vi ? ' <span class="small">(' + escapeHtml(m.don_vi) + ')</span>' : ''}</td>${cols.map(i => { const p = m.pts.find(q => q.i === i); return `<td class="num">${p ? escapeHtml(thapPhan(p.v)) : '–'}</td>`; }).join('')}<td class="num"><strong>${delta(m)}</strong></td></tr>`).join('')).join('')
        }</tbody></table></div>`;
        const bd = coSoLieu.length ? nhom.map(x => {
            const ds = x.ds.filter(m => m.pts.length >= 2);
            return ds.length ? `<div class="ib-group" style="margin-top:12px">${escapeHtml(x.ten)}</div><div class="cmp-grid">${ds.map(m => `<div class="cmp-card"><div class="cmp-head"><b>${escapeHtml(m.ten)}</b><span class="small">${escapeHtml(m.don_vi)}</span><span class="dl">${delta(m)}</span></div>${veBieuDo(m)}</div>`).join('')}</div>` : '';
        }).join('') : '<p class="empty">Mỗi chỉ số cần xuất hiện ở ít nhất 2 lần đo mới vẽ được biểu đồ.</p>';
        return `<h5 style="margin:6px 0">Bảng so sánh ${lans.length} lần đo</h5>${bang}<h5 style="margin:14px 0 0">Biểu đồ theo thời gian</h5>${bd}`;
    }

    function renderSoSanh() {
        const el = $('ib-cmp');
        if (!el) return;
        el.innerHTML = db || scans.length ? soSanhHtml(scans) : '<p class="empty">Chưa kết nối kho lưu trữ nên chưa có lịch sử để so sánh.</p>';
        const btn = $('ib-xh-run');
        if (btn) btn.disabled = ibBusy || !sampleFn || demLanInBody(scans) < SO_LAN_TOI_THIEU;
        renderXuHuongText();
    }
    function renderXuHuongText() {
        const box = $('ib-xh');
        if (!box || ibBusy) return;
        if (!xuHuong || !xuHuong.text || demLanInBody(scans) < SO_LAN_TOI_THIEU) { box.hidden = true; return; }
        box.hidden = false;
        box.innerHTML = ddHtmlDanhGia(xuHuong.text) + `<div class="small">Nhận xét xu hướng lúc ${escapeHtml(ngayGio(xuHuong.at))}, dựa trên ${xuHuong.n || '?'} lần đo. Chỉ để tham khảo, không thay cho tư vấn y tế.</div>`;
    }

    function promptXuHuong(list) {
        const g = gomSoLieu(list);
        const plan = DAYS.map(d => `${d}: ${state.days[d].tieu_de} (${state.days[d].nhom_co})`).join('\n');
        const so = g.metrics.map(m => `- ${m.ten}${m.don_vi ? ' (' + m.don_vi + ')' : ''}: ` + m.pts.map(p => p.nhan + ' = ' + thapPhan(p.v)).join('; ')).join('\n') || '(không có chỉ số dạng số)';
        const qs = g.lans.filter(l => l.an.quan_sat.length).map(l => `- ${l.nhan}: ${l.an.quan_sat.join('; ')}`).join('\n') || '(không có)';

    async function luuLanDo(an, blobs) {
        if (!db) { trangThai('Kết quả chưa được lưu.'); return null; }

        if (assetsNs) {
            for (const blob of blobs) {
                try { const up = await assetsNs.upload(blob, { type: blob.type || 'image/jpeg' }); ids.push(up.id); } catch (e) { /* bỏ qua ảnh này */ }
            }

        try {
            const at = Date.now();
            await db.collection('inbody').add({ createdAt: at, anh: ids[0] || null, anhs: ids, phan_tich: an });
            trangThai(ids.length === blobs.length && ids.length ? 'Đã lưu kết quả và ảnh.' : 'Đã lưu kết quả (không lưu được toàn bộ ảnh gốc).');
            return at;
        } catch (e) {
            trangThai('Phân tích xong nhưng chưa lưu được kết quả.', true);
            return null;
        }
    }

    async function chayPhanTich() {
        if (!ibFiles.length || ibBusy || !sampleFn) return;
        ibBusy = true;
        const ctl = new AbortController();
        ibCtl = ctl;
        nutChay(true);
        $('ib-result').innerHTML = '';
        trangThai('Đang kiểm tra và chuẩn bị ảnh…');
        try {
            const prep = [];
            for (const it of ibFiles.slice()) prep.push(await chuanBiAnh(it.file));
            if (ctl.signal.aborted) throw { code: 'cancelled' };
            // Kiểm tra sơ bộ trên máy: ảnh quá nhỏ thì chữ trên phiếu không thể đọc chắc chắn
            const nho = [];
            prep.forEach((x, i) => { if (x.w && (Math.max(x.w, x.h) < 900 || Math.min(x.w, x.h) < 500)) nho.push(`Ảnh ${i + 1} có độ phân giải thấp (${x.w}×${x.h}), chữ trên phiếu sẽ khó đọc.`); });
            if (nho.length) { $('ib-result').innerHTML = canhBaoAnhKem(nho); trangThai('Chưa gửi cho Claude vì ảnh quá nhỏ.', true); return; }
            // Ghép danh sách ảnh gửi đi, trong giới hạn số ảnh cho phép
            const n = prep.length, k = Math.max(0, Math.min(3, Math.floor((ibCap - n) / n)));
            const gui = [], moTa = [];
            prep.forEach((x, i) => {
                gui.push(x.whole); moTa.push(`Ảnh ${gui.length}: toàn bộ ảnh số ${i + 1}`);
                x.bands.slice(0, k).forEach(bd => { gui.push(bd.blob); moTa.push(`Ảnh ${gui.length}: ${bd.ten} của ảnh số ${i + 1}, phóng to để đọc chữ nhỏ`); });
            });
            trangThai('Claude đang đọc ' + n + ' ảnh' + (gui.length > n ? ' (' + gui.length + ' phần cắt)' : '') + ', thường mất 20 đến 120 giây…');
            const raw = await sampleFn.json(promptInBody(moTa.join('\n')), { images: gui, signal: ctl.signal });
            const an = chuanHoaPhanTich(raw);
            const kq = kiemTraChatLuong(an);

                trangThai('Ảnh chưa đủ chất lượng, chưa lưu kết quả.', true);
                return;
            }
            hienKetQua(an);
            trangThai('Đang lưu kết quả…');
            const at = await luuLanDo(an, prep.map(x => x.whole));
            if (an.chi_so.length || an.quan_sat.length) {
                const moi = { id: '__moi', createdAt: at || Date.now(), phan_tich: an };
                const list = scans.filter(x => !at || x.createdAt !== at).concat([moi]);
                const cu = scans; scans = list; renderSoSanh(); scans = cu;
                await chayXuHuong(list, true);
            }
        } catch (e) {
            if (e && e.code === 'cancelled') trangThai('Đã dừng.');
            else trangThai(loiSample(e), true);
        } finally {
            ibBusy = false;
            ibCtl = null;
            nutChay(false);
            renderSoSanh();
        }
    }

    let dragState = null;

    function luuThuTuDongTac(ngay, names) {
        const cu = state.days[ngay].bai_tap;
        if (names.length !== cu.length || names.every((n, i) => n === cu[i])) return false;
        state.days[ngay].bai_tap = names;
        persist();
        return true;
    }

    function dragMove(e) {
        if (!dragState || e.pointerId !== dragState.pid) return;
        const { ex, list } = dragState;
        const items = Array.from(list.querySelectorAll('.ex')).filter(x => x !== ex);
        let before = null;
        for (const it of items) {
            const r = it.getBoundingClientRect();
            if (e.clientY < r.top + r.height / 2) { before = it; break; }
        }
        if (before) { if (ex.nextElementSibling !== before) list.insertBefore(ex, before); }
        else if (list.lastElementChild !== ex) list.appendChild(ex);
        // tự cuộn trong ô khi kéo sát mép
        const body = list.closest('.day-body');
        if (body) {
            const br = body.getBoundingClientRect();
            if (e.clientY < br.top + 28) body.scrollTop -= 12;
            else if (e.clientY > br.bottom - 28) body.scrollTop += 12;
        }
    }
    function dragEnd(e) {
        if (!dragState || (e && e.pointerId !== dragState.pid)) return;
        const { ex, list, day } = dragState;
        document.removeEventListener('pointermove', dragMove);
        document.removeEventListener('pointerup', dragEnd);
        document.removeEventListener('pointercancel', dragEnd);
        ex.classList.remove('dragging');
        document.body.classList.remove('is-dragging');
        dragState = null;
        const names = Array.from(list.querySelectorAll('.ex')).map(x => x.dataset.ex);
        if (e && e.type === 'pointercancel') { renderCalendar(); return; }
        if (luuThuTuDongTac(day, names)) showToast('Đã đổi thứ tự động tác ' + day + '.');
    }

    $('calendar').addEventListener('pointerdown', e => {
        const g = e.target.closest('[data-grip]');
        if (!g || (e.pointerType === 'mouse' && e.button !== 0)) return;
        const ex = g.closest('.ex'), list = ex.parentElement;
        e.preventDefault();
        dragState = { ex, list, day: list.dataset.dayList, pid: e.pointerId };
        ex.classList.add('dragging');
        document.body.classList.add('is-dragging');
        document.addEventListener('pointermove', dragMove);
        document.addEventListener('pointerup', dragEnd);
        document.addEventListener('pointercancel', dragEnd);
    });

    // Bàn phím: focus vào ⋮⋮ rồi bấm mũi tên lên/xuống
    $('calendar').addEventListener('keydown', e => {
        const g = e.target.closest('[data-grip]');
        if (!g || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
        e.preventDefault();
        const ex = g.closest('.ex'), list = ex.parentElement, day = list.dataset.dayList;
        const names = state.days[day].bai_tap.slice();
        const i = names.indexOf(ex.dataset.ex), j = i + (e.key === 'ArrowUp' ? -1 : 1);
        if (i < 0 || j < 0 || j >= names.length) return;
        [names[i], names[j]] = [names[j], names[i]];
        luuThuTuDongTac(day, names);
        renderCalendar();
        const again = Array.from(document.querySelectorAll('.ex')).find(x => x.closest('[data-day-list]').dataset.dayList === day && x.dataset.ex === names[j]);
        if (again) again.querySelector('[data-grip]').focus();
    });

    function xayDungVanBan() {
        const L = [], dong = (t) => L.push(t === undefined ? '' : t);

        dong('LỊCH TẬP LUYỆN');

        dong('Số ngày thực hiện liên tiếp hiện tại: ' + state.so_ngay_lien_tiep + ' ngày');

        khoiTieuDe('1. LỊCH TẬP TRONG TUẦN');
        DAYS.forEach(ngay => {
            const x = state.days[ngay];
            dong(); dong(ngay.toUpperCase() + ' - ' + x.tieu_de);
            dong(gachNho);
            if (x.nhom_co.trim()) dong('Nhóm cơ: ' + x.nhom_co);
            dong('Nội dung:'); lines(x.noi_dung, '  ');
            if (x.bai_tap.length) {
                dong('Động tác và tải:');
                x.bai_tap.forEach((n, i) => {
                    const e = state.dong_tac[n] || {}, t = [];
                    if (coSo(e.tai_dung)) t.push('tải ' + fmt(e.tai_dung) + ' kg');
                    if (coSo(e.tai_ho_tro)) t.push('hỗ trợ ' + fmt(e.tai_ho_tro) + ' kg');
                    if (e.ghi_chu && e.ghi_chu.trim()) t.push('ghi chú: ' + e.ghi_chu.split('\n').map(z => z.trim()).filter(Boolean).join('; '));
                    dong('  ' + (i + 1) + '. ' + n + (t.length ? ' (' + t.join('; ') + ')' : ''));
                });
            }
        });
        dong(); dong('LỊCH BỔ TRỢ');
        RT_KEYS.forEach(k => {
            const rt = state.lich_bo_tro[k];
            dong(gachNho); dong(rt.ten.toUpperCase() + ' - ngày: ' + (rt.ngay.join(', ') || 'chưa xếp'));

            lines(rt.noi_dung, '  ');
        });

        khoiTieuDe('2. DINH DƯỠNG BỔ SUNG');
        const dd = state.dinh_duong;
        dong('Lưu ý chung:'); if (dd.luu_y.trim()) lines(dd.luu_y, '  '); else dong('  (chưa ghi)');
        DAYS.forEach(ngay => {
            dong(); dong(ngay.toUpperCase());
            BUOI.forEach(b => {
                const t = dd.ngay[ngay][b].trim();
                if (!t) { dong('  ' + b + ': (chưa ghi)'); return; }
                const ls = t.split('\n').map(z => z.trim()).filter(Boolean);
                dong('  ' + b + ': ' + ls[0]); ls.slice(1).forEach(z => dong('         ' + z));
            });
        });

        khoiTieuDe('3. LỊCH SỬ TẬP VÀ TĂNG GIẢM TẢI (CHECK TẢI)');
        const td = state.theo_doi, cot = (t, w) => { t = String(t); return t.length >= w ? t.slice(0, w - 1) + ' ' : t + ' '.repeat(w - t.length); };
        const dau = v => v === null ? '-' : (Math.abs(v) < 1e-9 ? '0' : (v > 0 ? '+' : '-') + fmt(Math.abs(v)));
        const hieu = (a, b) => (a === null || b === null) ? null : b - a;
        const nhomSet = (sets, ten) => {
            const out = [];
            sets.forEach(x => {
                const k = (coSo(x.tai) ? fmt(x.tai) : '?') + 'x' + (coSo(x.rep) ? fmt(x.rep) : '?') + (coSo(x.ho) && x.ho > 0 ? '(ht ' + fmt(x.ho) + ')' : '');
                const l = out[out.length - 1];
                if (l && l.k === k) l.n++; else out.push({ k: k, n: 1 });
            });
            return out.map(z => z.k + (z.n > 1 ? ' x' + z.n + ' set' : '')).join(', ');
        };
        const dsTen = dsTenDongTac().filter(n => td.nhat_ky.some(e => e.dong_tac === n));
        dong('Mốc theo dõi: ' + ngayVN(td.moc) + '. Tải tính bằng kg; "tải đỉnh" là mức tạ nặng nhất trong buổi;');
        dong('Farmer\'s Carry tính theo cự ly (m). Thay đổi so với lần ghi đầu tiên của động tác.');
        if (!dsTen.length) dong(), dong('Chưa có buổi tập nào được ghi trong mục Check tải.');
        else {
            const tom = dsTen.map(n => {
                const es = td.nhat_ky.filter(e => e.dong_tac === n).map((e, i) => ({ e: e, i: i })).sort((x, y) => (x.e.ngay < y.e.ngay ? -1 : x.e.ngay > y.e.ngay ? 1 : x.i - y.i)).map(x => x.e);
                return { n: n, es: es };
            });
            dong(); dong('A. BẢNG TỔNG HỢP');
            const W = [22, 6, 11, 11, 11, 14, 12];
            const hdr = ['Động tác', 'Buổi', 'Lần cuối', 'Tải đỉnh', 'Đổi tải', 'Đổi tổng rep', 'Xu hướng'];
            const tv = sets => { const t = taiCaoNhat(sets); if (t !== null) return t; const h = hoMax(sets); return h === null ? null : -h; };
            const hienTai = sets => { const t = taiCaoNhat(sets); if (t !== null) return fmt(t); const h = hoMax(sets); return h === null ? '-' : 'ht ' + fmt(h); };
            dong(hdr.map((h, i) => cot(h, W[i])).join('| '));
            dong('-'.repeat(W.reduce((a, b) => a + b + 2, 0)));
            tom.forEach(z => {
                const f = z.es[0], l = z.es[z.es.length - 1];
                const dt = hieu(tv(f.sets), tv(l.sets)), dr = hieu(tongRep(f.sets), tongRep(l.sets));
                const xh = z.es.length < 2 ? 'Mới 1 buổi' : (dt !== null && dt > 0) || (dt === 0 && dr !== null && dr > 0) ? 'Tăng' : (dt !== null && dt < 0) || (dt === 0 && dr !== null && dr < 0) ? 'Giảm' : 'Giữ nguyên';
                                dong([z.n, z.es.length, ngayVN(l.ngay), hienTai(l.sets) === '-' ? '-' : hienTai(l.sets) + ' kg', z.es.length < 2 ? '-' : dau(dt) + ' kg', z.es.length < 2 ? '-' : dau(dr) + ' ' + donViSet(z.n).ngan, xh].map((c, i) => cot(c, W[i])).join('| '));
            });
            dong(); dong('B. LỊCH SỬ TỪNG ĐỘNG TÁC (mới nhất ở trên)');
            tom.forEach(z => {
                dong(); dong(z.n.toUpperCase() + (laCuLy(z.n) ? '  [cự ly, m]' : ''));
                const W2 = [11, 10, 11, 10, 10];
                dong(['Ngày', 'Tải đỉnh', laCuLy(z.n) ? 'Tổng m' : 'Tổng rep', 'Đổi tải', laCuLy(z.n) ? 'Đổi m' : 'Đổi rep'].map((h, i) => cot(h, W2[i])).join('| ') + '| Các set');
                dong('-'.repeat(78));
                const dong2 = z.es.map((e, i) => {
                    const pr = i ? z.es[i - 1] : null, tr = tongRep(e.sets);
                    return { e: e, tp: hienTai(e.sets), tr: tr, dt: pr ? hieu(tv(pr.sets), tv(e.sets)) : null, dr: pr ? hieu(tongRep(pr.sets), tr) : null };
                }).reverse();
                dong2.forEach(r => {
                    dong([ngayVN(r.e.ngay), r.tp, r.tr === null ? '-' : fmt(r.tr), dau(r.dt), dau(r.dr)].map((c, i) => cot(c, W2[i])).join('| ') + '| ' + nhomSet(r.e.sets, z.n));
                    if (r.e.ghi_chu) dong('            Ghi chú buổi: ' + r.e.ghi_chu.split('\n').map(q => q.trim()).filter(Boolean).join('; '));
                });
            });
            dong(); dong('Cột "Đổi tải", "Đổi rep" ở bảng B so với buổi liền trước. Định dạng set: tải x rep (ht = tạ hỗ trợ; với bài có hỗ trợ, đổi tải âm = giảm hỗ trợ = tiến bộ).');
        }

        // BOM và xuống dòng kiểu Windows để Notepad hiển thị đúng tiếng Việt
        return '\uFEFF' + L.join('\r\n') + '\r\n';
    }

    async function anhThanhDataUrl(id) {
        try {
            let b;
            if (window.__offlineGetBlob) b = await window.__offlineGetBlob(id);
            else { const r = await fetch('/_blob/' + id); if (!r.ok) return null; b = await r.blob(); }
            if (!b) return null;
            return await new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = () => res(null); f.readAsDataURL(b); });
        } catch (e) { return null; }
    }
    // Nhập phần Inbody + xu hướng + Đếm giờ từ file JSON (bỏ qua lần đo đã có, không nhân đôi)
    async function nhapPhuTro(parsed) {
        let soLan = 0;
        try {
            if (parsed.demgio && typeof parsed.demgio === 'object' && Array.isArray(parsed.demgio.bt) && parsed.demgio.bt.length) {
                if (dg.pha === 'run' || dg.pha === 'pause') dgDatLai();
                dg.bt = parsed.demgio.bt.slice(0, 20).map(dgChuanBT);
                if (isFinite(+parsed.demgio.vol)) dg.vol = Math.min(1, Math.max(0, +parsed.demgio.vol));
                dgNap(Math.min(Math.max(0, Math.round(+parsed.demgio.cur) || 0), dg.bt.length - 1));
                luuDG();
            }
        } catch (e) { /* bỏ qua */ }
        if (!db) return { soLan: 0, boQua: Array.isArray(parsed.inbody) && parsed.inbody.length };
        try {
            if (parsed.inbody_xu_huong && typeof parsed.inbody_xu_huong === 'object' && parsed.inbody_xu_huong.text && (!xuHuong || (+parsed.inbody_xu_huong.at || 0) > (+xuHuong.at || 0))) {
                const xh = { text: String(parsed.inbody_xu_huong.text).slice(0, 12000), at: +parsed.inbody_xu_huong.at || Date.now(), n: +parsed.inbody_xu_huong.n || 0 };
                await db.doc('plan/inbody_xu_huong').set(xh);
            }
        } catch (e) { /* bỏ qua */ }
        const daCo = new Set(scans.map(s => s.createdAt));
        const ds = (Array.isArray(parsed.inbody) ? parsed.inbody : []).slice(0, 200);
        for (const it of ds) {
            try {
                if (!it || typeof it !== 'object' || !isFinite(+it.createdAt) || daCo.has(+it.createdAt)) continue;
                const ids = [];
                if (assetsNs && Array.isArray(it.anhs)) {
                    for (const u of it.anhs.slice(0, 12)) {
                        if (typeof u !== 'string' || !u.startsWith('data:')) continue;
                        try { const blob = await (await fetch(u)).blob(); const up = await assetsNs.upload(blob, { type: blob.type || 'image/jpeg' }); ids.push(up.id); } catch (e) { /* bỏ qua ảnh này */ }
                    }
                }
                await db.collection('inbody').add({ createdAt: +it.createdAt, anh: ids[0] || null, anhs: ids, phan_tich: chuanHoaPhanTich(it.phan_tich) });
                daCo.add(+it.createdAt); soLan++;
            } catch (e) { /* bỏ qua lần đo này */ }
        }
        return { soLan: soLan };
    }

    const DG_KEY = 'lich_tap_demgio_v1';
    const dg = {
        steps: [{ ten: 'Squat', giay: 40 }, { ten: 'Nghỉ', giay: 20 }, { ten: 'Plank', giay: 40 }, { ten: 'Nghỉ', giay: 20 }],
        vong: 3, vol: 0.8, ten: 'Squat và Plank', bt: [], cur: 0,
        pha: 'idle',            // idle | run | pause | done
        runStart: 0, dungTai: 0, // mốc Date.now() lúc bắt đầu (đã trừ phần đã chạy) / thời gian đã chạy khi tạm dừng
        idx: -1, seq: [], mocCuoi: [], tong: 0,

    };
    function dgChuanBuoc(arr) { return arr.slice(0, 40).map(s => ({ ten: String((s && s.ten) || '').slice(0, 40), giay: Math.min(5999, Math.max(1, Math.round(+(s && s.giay)) || 1)) })); }
    function dgChuanBT(b) { return { ten: String((b && b.ten) || '').slice(0, 60), vong: Math.min(99, Math.max(1, Math.round(+(b && b.vong)) || 1)), steps: dgChuanBuoc(Array.isArray(b && b.steps) && b.steps.length ? b.steps : [{ ten: 'Tập', giay: 30 }]) }; }
    function dgNap(i) { const b = dg.bt[i]; dg.cur = i; dg.ten = b.ten; dg.vong = b.vong; dg.steps = b.steps; }
    function dgGhiLai() { dg.bt[dg.cur] = { ten: dg.ten, vong: dg.vong, steps: dg.steps }; }
    (function docDG() {
        try {
            const r = JSON.parse(localStorage.getItem(DG_KEY) || 'null');
            if (r && isFinite(+r.vol)) dg.vol = Math.min(1, Math.max(0, +r.vol));
            if (r && Array.isArray(r.bt) && r.bt.length) dg.bt = r.bt.slice(0, 20).map(dgChuanBT);
            else if (r && Array.isArray(r.steps) && r.steps.length) dg.bt = [dgChuanBT(r)];   // dữ liệu bản trước: một chương trình duy nhất
        } catch (e) { /* dùng mặc định */ }
        if (!dg.bt.length) dg.bt = [dgChuanBT({ ten: dg.ten, vong: dg.vong, steps: dg.steps })];
        let c = 0; try { c = Math.round(+JSON.parse(localStorage.getItem(DG_KEY) || '{}').cur) || 0; } catch (e) { c = 0; }
        dgNap(Math.min(Math.max(0, c), dg.bt.length - 1));

    function dgMmss(giay) { giay = Math.max(0, Math.round(giay)); return Math.floor(giay / 60) + ':' + String(giay % 60).padStart(2, '0'); }

    function dgViTri(ms) {

    // --- Tiếng chuông: 2 tiếng giống nhau cách nhau 0,28 giây ---

            dgDatLai(); dg.bt.splice(dg.cur, 1); dgNap(Math.min(dg.cur, dg.bt.length - 1)); luuDG(); ve();
        };
        $('dg-thu').onclick = dgThuChuong;
        $('dg-main').onclick = () => { if (dg.pha === 'run') dgTamDung(); else dgChay(); khoa(); };
        $('dg-truoc').onclick = () => dgNhay((dg.idx < 0 ? 0 : dg.idx) - 1);
        $('dg-boqua').onclick = () => dgNhay((dg.idx < 0 ? 0 : dg.idx) + 1);
        $('dg-datlai').onclick = () => { dgDatLai(); khoa(); };
        // trình soạn
        const ds = $('dg-ds');
        const doiGiay = row => { const p = Math.max(0, +row.querySelector('[data-f=p]').value || 0), g = Math.max(0, +row.querySelector('[data-f=g]').value || 0); return Math.min(5999, Math.max(1, Math.round(p * 60 + g))); };
        ds.addEventListener('input', e => { const row = e.target.closest('.dg-row'); if (!row || e.target.dataset.f !== 'ten') return; dg.steps[+row.dataset.i].ten = e.target.value.slice(0, 40); dgSuaChuongTrinh(); $('dg-bar').outerHTML = dgThanhPhan(); dgTomTat(); dgVe(); });
        ds.addEventListener('change', e => {
            const row = e.target.closest('.dg-row'); if (!row || (e.target.dataset.f !== 'p' && e.target.dataset.f !== 'g')) return;
            dg.steps[+row.dataset.i].giay = doiGiay(row);   // ví dụ 90 giây tự thành 1:30
            dgSuaChuongTrinh(); ve();
        });
        ds.addEventListener('click', e => {
            const b = e.target.closest('[data-a]'); if (!b) return;
            const i = +b.closest('.dg-row').dataset.i;
            if (b.dataset.a === 'len' && i > 0) [dg.steps[i - 1], dg.steps[i]] = [dg.steps[i], dg.steps[i - 1]];
            else if (b.dataset.a === 'xuong' && i < dg.steps.length - 1) [dg.steps[i + 1], dg.steps[i]] = [dg.steps[i], dg.steps[i + 1]];
            else if (b.dataset.a === 'xoa' && dg.steps.length > 1) dg.steps.splice(i, 1);
            dgSuaChuongTrinh(); ve();
        });
        $('dg-them').onclick = () => { if (dg.steps.length >= 40) { showToast('Tối đa 40 bước.', true); return; } dg.steps.push({ ten: '', giay: 30 }); dgSuaChuongTrinh(); ve(); };
        const datVong = v => { dg.vong = Math.min(99, Math.max(1, Math.round(+v) || 1)); dgSuaChuongTrinh(); ve(); };
        $('dg-vong').onchange = e => datVong(e.target.value);
        $('dg-vtru').onclick = () => datVong(dg.vong - 1);
        $('dg-vcong').onclick = () => datVong(dg.vong + 1);
    }
    $('btn-demgio').addEventListener('click', moDemGio);
    dgTinh();

    // ---------- Khởi chạy ----------
    state = loadLocal();
    renderCalendar();
    renderStreak();

    async function khoiTaoCapability() {
        const c = window.claude;
        if (!c || !c.use) { setSync('local'); chuoiSanSang = true; capNhatHoanThanh(); return; }
        setSync('loading');
        const lay = async name => { try { return await c.use(name); } catch (e) { return null; } };
        const [dbNs, sample, assets, downloads] = await Promise.all([lay('db'), lay('sample'), lay('assets'), lay('downloads')]);
        assetsNs = assets;
        downloadsNs = downloads;
        sampleFn = sample;
        if (sampleFn) {
            let lim = null;
            try { lim = await sampleFn.limits(); } catch (e) { lim = null; }
            sampleImg = !!(lim && lim.images);
            if (sampleImg && lim.images.mediaTypes && lim.images.mediaTypes.length) sampleAccept = lim.images.mediaTypes.join(',');
            if (sampleImg && lim.images.maxCount) { ibCap = Math.max(1, lim.images.maxCount); ibMax = Math.max(1, Math.min(lim.images.maxCount, 6)); }
            $('btn-inbody').hidden = false;
        }
        db = dbNs;
        if (db) {
            planRef = db.doc('plan/main');
            planRef.onSnapshot(onRemotePlan, () => setSync('error'));
            db.doc('plan/inbody_xu_huong').onSnapshot(sn => { xuHuong = sn.exists ? sn.data() : null; renderXuHuongText(); }, () => {});
            db.collection('inbody').orderBy('createdAt', 'desc').limit(50).onSnapshot(snap => {
                scans = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
                lamMoiLichSu();
            }, () => { /* lịch sử không tải được: bỏ qua */ });
        } else {
            setSync('local');
            chuoiSanSang = true; capNhatHoanThanh();
        }
    }
    khoiTaoCapability();
    // ---------- Chỉ một tab: mở thêm tab thì đóng tab mới, quay lại tab đã có ----------
    (function () {
        if (!window.BroadcastChannel) return;
        let ch; try { ch = new BroadcastChannel('lich_tap_mot_tab_v1'); } catch (e) { return; }
        const id = Math.random().toString(36).slice(2) + Date.now().toString(36);
        let nhuong = false, lop = null;
        function hienLop(noiDung, nutChinh, hanhDong, nutPhu) {
            if (!lop) {
                lop = document.createElement('div');
                lop.style.cssText = 'position:fixed;inset:0;z-index:9999;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center';
                document.body.appendChild(lop);
            }
            lop.innerHTML = '<div style="max-width:360px"><h3 style="margin:0 0 8px">Lịch tập đang mở ở tab khác</h3><p class="small" style="margin:0 0 16px">' + noiDung + '</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"></div></div>';
            const hang = lop.querySelector('div > div');
            [[nutChinh, hanhDong, true], nutPhu ? [nutPhu[0], nutPhu[1], false] : null].forEach(b => {
                if (!b) return;
                const el = document.createElement('button'); el.type = 'button'; el.className = 'btn' + (b[2] ? ' btn-primary' : ''); el.textContent = b[0]; el.onclick = b[1]; hang.appendChild(el);
            });
        }
        function anLop() { if (lop) { lop.remove(); lop = null; } nhuong = false; }
        function laTabPhu() {
            nhuong = true;
            hienLop('Để tránh trùng lặp, hãy dùng tab đã mở sẵn. Tab này sẽ bị đóng.', 'Đóng tab này', () => { try { window.close(); } catch (e) {} },
                ['Dùng tab này', () => { ch.postMessage({ t: 'takeover', id: id }); anLop(); if (typeof layBanMoiNhat === 'function') layBanMoiNhat(); }]);
            try { window.close(); } catch (e) { /* trình duyệt không cho đóng: để nút bên dưới */ }
        }
        ch.onmessage = ev => {
            const m = ev.data || {};
            if (m.id === id) return;
            if (m.t === 'hello' && !nhuong) { ch.postMessage({ t: 'here', to: m.id, id: id }); try { window.focus(); } catch (e) {} }
            else if (m.t === 'here' && m.to === id) laTabPhu();
            else if (m.t === 'takeover' && !nhuong) {
                nhuong = true;
                hienLop('Anh vừa chuyển sang dùng ở tab khác. Bấm nút dưới để dùng lại tab này.', 'Dùng tab này', () => { ch.postMessage({ t: 'takeover', id: id }); anLop(); if (typeof layBanMoiNhat === 'function') layBanMoiNhat(); });
            }
        };
        ch.postMessage({ t: 'hello', id: id });
    })();
    $('btn-inbody').hidden = false;
    if (window.__khongLuuDuoc) setTimeout(() => showToast('Trình duyệt không cho lưu dữ liệu khi mở file trực tiếp. Hãy mở bằng cách cài ứng dụng (xem HUONG_DAN) hoặc xuất JSON thường xuyên.', true), 800);
</script>
